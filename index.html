<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>영어 문장 연습</title>
<meta name="theme-color" content="#eef1f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 연습">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&display=swap">
<style>
:root { --bg: #eef1f2; --paper: #ffffff; --ink: #18242b; --muted: #5f6f78; --line: #d6dde0; --accent: #0f5c63; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #11181c; --paper: #182227; --ink: #e5ecee; --muted: #93a3aa; --line: #2b383e; --accent: #6cc3c8; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; display: flex; flex-direction: column; }
.tabs { flex: none; display: flex; gap: 4px; padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: var(--bg); }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600; padding: 9px 16px 10px; border-radius: 10px 10px 0 0; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); border-color: var(--line); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tabs .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
.frames { flex: 1; position: relative; min-height: 0; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<nav class="tabs" role="tablist" aria-label="연습 도구">
  <button role="tab" id="tab-cards" aria-controls="f-cards" data-tab="cards">문장 가림판</button>
  <button role="tab" id="tab-repeat" aria-controls="f-repeat" data-tab="repeat">구간 반복</button>
</nav>
<div class="frames">
  <iframe id="f-cards" title="문장 가림판" src="cards.html"></iframe>
  <iframe id="f-repeat" title="구간 반복" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen hidden></iframe>
</div>
<script>
// Both tools stay loaded, so a video keeps its place while you switch tabs.
const TABS = ["cards", "repeat"];
const shared = location.hash.startsWith("#d=") ? location.hash : "";
let repeatLoaded = false;
function show(name) {
  if (!TABS.includes(name)) name = "cards";
  if (name === "repeat" && !repeatLoaded) {
    document.getElementById("f-repeat").src = "repeat.html" + shared;
    repeatLoaded = true;
  }
  for (const t of TABS) {
    document.getElementById("f-" + t).hidden = t !== name;
    document.getElementById("tab-" + t).setAttribute("aria-selected", String(t === name));
  }
  try { localStorage.setItem("practice.tab", name); } catch (e) {}
  history.replaceState(null, "", "#" + name);
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) show(b.dataset.tab); });
let start = shared ? "repeat" : location.hash.slice(1);
if (!TABS.includes(start)) { try { start = localStorage.getItem("practice.tab") || "cards"; } catch (e) { start = "cards"; } }
show(start);
</script>
</body>
</html>
