<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문장 가림판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one study column; sticky control strip; each phrase is a two-sided row where either side can be taped over */
:root {
  --bg: #eef1f2;
  --paper: #ffffff;
  --ink: #18242b;
  --muted: #5f6f78;
  --line: #d6dde0;
  --accent: #0f5c63;
  --accent-soft: #dcecec;
  --tape: #f3d65a;
  --tape-ink: #4f430c;
  --ok: #2f7d4f;
  --danger: #b23a2b;
  --f-en: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11181c; --paper: #182227; --ink: #e5ecee; --muted: #93a3aa; --line: #2b383e;
  --accent: #6cc3c8; --accent-soft: #1d3436; --tape: #c9ac2e; --tape-ink: #241e02;
  --ok: #6cc28c; --danger: #e27463; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11181c; --paper: #182227; --ink: #e5ecee; --muted: #93a3aa; --line: #2b383e;
  --accent: #6cc3c8; --accent-soft: #1d3436; --tape: #c9ac2e; --tape-ink: #241e02;
  --ok: #6cc28c; --danger: #e27463; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-size: 15px; background: var(--bg); color: var(--ink); font-family: var(--f-ko); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.saved-state { font-size: 12px; color: var(--muted); }
.hdr-right { display: inline-flex; gap: 10px; align-items: center; }
.ai-panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; margin-bottom: 14px; }
.ai-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ai-row input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 9px 11px; font-family: ui-monospace, monospace; }

.sets { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 14px; font-size: 14px; white-space: nowrap; display: grid; justify-items: start; align-content: center; gap: 1px; line-height: 1.3; text-align: left; }
.chip small { font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.chip.add { border-style: dashed; color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--paper); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }

.bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--ask-h, 0px)); z-index: 5; background: var(--bg); padding-block: 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.bar-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); padding: 6px 4px; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.progress { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); transition: width .3s; }

.section-name { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--accent); margin: 22px 0 6px; display: flex; gap: 8px; align-items: baseline; }
.section-name span { color: var(--muted); font-weight: 400; letter-spacing: 0; }

.row { display: grid; grid-template-columns: 34px 1.8em minmax(0,1fr) minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row.known .num { color: var(--ok); }
.num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: left; }
.en { font-family: var(--f-en); font-size: 17px; line-height: 1.4; min-width: 0; }
.ko { font-size: 15px; min-width: 0; color: var(--ink); }
.cell { min-height: 2.2em; display: flex; align-items: center; }
.cover { width: 100%; min-height: 2.4em; border: 0; border-radius: 6px; text-align: left; padding: 6px 10px; font-size: 13px; color: var(--tape-ink);
  background: repeating-linear-gradient(-45deg, var(--tape) 0 10px, color-mix(in srgb, var(--tape) 82%, var(--paper)) 10px 20px); }
.cover:hover { filter: brightness(1.04); }
.cell.peek { animation: reveal .25s ease-out; }
@keyframes reveal { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
.mark { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); }
.mark[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.mark svg { width: 16px; height: 16px; }

@media (max-width: 620px) {
  .ask-thread { max-height: 28vh; }
  .ask { padding: 10px 12px; gap: 8px; }
  .row { grid-template-columns: 34px 1.5em minmax(0,1fr) auto; column-gap: 8px; row-gap: 6px; }
  .row .mark { grid-column: 1; grid-row: 1 / span 2; }
  .row .num { grid-column: 2; grid-row: 1 / span 2; }
  .row .en { grid-column: 3; grid-row: 1; }
  .row .ko { grid-column: 3; grid-row: 2; }
  .row .tools { grid-column: 4; grid-row: 1 / span 2; flex-direction: column; }
  .progress { margin-left: 0; width: 100%; }
}

.empty { text-align: center; color: var(--muted); padding: 48px 12px; }

.editor { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; margin-bottom: 18px; }
.editor h2 { margin: 0; font-size: 17px; }
.editor label { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.editor input[type=text], .editor textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px 12px; }
.editor textarea { min-height: 220px; resize: vertical; font-size: 14px; line-height: 1.55; tab-size: 4; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.hint code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions .spacer { flex: 1; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--danger); }
.tools { display: flex; gap: 6px; }
.copybtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); }
.copybtn svg { width: 16px; height: 16px; }
.copybtn:hover { color: var(--accent); border-color: var(--accent); }
.copybtn.done { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.askbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--accent); font-weight: 700; font-size: 15px; }
.askbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.row.asking { background: var(--accent-soft); }
.ask { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; margin-bottom: 16px; box-shadow: 0 6px 18px -10px rgb(0 0 0 / .35); }
.ask::before { content: ""; position: absolute; left: -1px; right: -1px; bottom: 100%; height: 20px; background: var(--bg); }
.ask.collapsed .ask-ctx, .ask.collapsed .ask-thread { display: none; }
.ask-head-btns { display: flex; gap: 6px; }
.ask-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ask h2 { margin: 0; font-size: 15px; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.ask-ctx { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.ctx-pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 5px 6px 5px 10px; }
.ctx-pill b { font-family: var(--f-en); font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.ctx-pill button { border: 0; background: transparent; color: var(--muted); font-size: 16px; width: 24px; height: 24px; border-radius: 5px; flex: none; }
.suggest { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--ink); }
.suggest:hover { border-color: var(--accent); }
.ask-thread { display: grid; gap: 10px; max-height: 34vh; overflow-y: auto; padding-right: 4px; }
.msg { font-size: 14.5px; line-height: 1.65; min-width: 0; overflow-wrap: anywhere; }
.msg.q { justify-self: end; max-width: 85%; background: var(--ink); color: var(--paper); border-radius: 12px 12px 3px 12px; padding: 8px 12px; }
.msg.q small { display: block; opacity: .7; font-family: var(--f-en); font-size: 13px; }
.msg.a { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.msg.a em.en { font-family: var(--f-en); font-style: normal; font-weight: 600; }
.msg.a ul { margin: 4px 0; padding-left: 20px; }
.msg.a p { margin: 0 0 6px; }
.msg.err { color: var(--danger); font-size: 14px; }
.ask-form { display: flex; gap: 8px; align-items: flex-end; }
.ask-form textarea { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 9px 12px; resize: vertical; min-height: 44px; line-height: 1.5; }
.w { cursor: pointer; border-radius: 3px; text-decoration: underline dotted transparent; text-underline-offset: 4px; transition: background .12s; }
.w:hover { text-decoration-color: var(--accent); }
.w.active { background: var(--accent-soft); text-decoration-color: var(--accent); }
.pop { position: absolute; left: 16px; top: 0; z-index: 30; width: min(340px, calc(100% - 32px)); max-width: calc(100vw - 32px); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgb(0 0 0 / .18); padding: 14px 16px; display: grid; gap: 8px; }
.pop-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-right: 28px; }
.pop-word { font-family: var(--f-en); font-size: 21px; font-weight: 600; }
.pop-ipa { font-size: 13px; color: var(--muted); }
.pop-pos { font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; }
.pop-meaning { font-size: 16px; font-weight: 600; }
.pop-why { font-size: 14px; line-height: 1.6; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.pop-why b { display: block; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
.pop { max-height: 80vh; overflow-y: auto; }
.pop-note, .pop-lemma { font-size: 14px; color: var(--muted); margin: 0; }
.pop-ex { font-family: var(--f-en); font-size: 15px; margin: 0; padding-top: 8px; border-top: 1px solid var(--line); }
.pop-ex span { display: block; font-family: var(--f-ko); font-size: 13px; color: var(--muted); }
.pop-close { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; border-radius: 6px; }
.pop-loading { color: var(--muted); font-size: 14px; }
.pop-loading::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.cell.peek { cursor: pointer; }
.rehide { flex: none; margin-left: 8px; border: 1px dashed var(--tape); background: transparent; color: var(--muted); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-family: var(--f-ko); }
.cell.peek > span { min-width: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }
@media (prefers-reduced-motion: reduce) { .cell.peek { animation: none; } .meter i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>문장 가림판 <small>한쪽을 가리고 외웠는지 확인 · 영어 단어를 누르면 뜻이 나와요</small></h1>
    <span class="hdr-right"><span class="saved-state" id="savedState"></span><button class="btn small" id="aiBtn" type="button">AI 설정</button></span>
  </header>
  <form class="ai-panel" id="aiPanel" hidden>
    <b>AI 기능 켜기 (단어 뜻 · AI에게 질문)</b>
    <p class="hint">Anthropic API 키를 넣으면 단어 설명과 질문 기능이 켜져요. 키는 이 기기의 브라우저에만 저장되고, 쓴 만큼 Anthropic에서 요금이 나와요. 키는 console.anthropic.com → API Keys에서 만들 수 있어요.</p>
    <div class="ai-row">
      <input type="password" id="aiKey" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
      <button class="btn primary" type="submit">저장</button>
      <button class="btn danger" type="button" id="aiDel">키 지우기</button>
    </div>
    <p class="hint" id="aiState"></p>
  </form>
  <section class="ask" id="ask" aria-label="AI에게 질문">
    <div class="ask-head">
      <h2>AI에게 문장 질문하기</h2>
      <div class="ask-head-btns">
        <button class="btn small" data-act="askClear" id="askClear" hidden>대화 지우기</button>
        <button class="btn small" data-act="askFold" id="askFold" aria-expanded="true">접기</button>
      </div>
    </div>
    <div class="ask-ctx" id="askCtx"></div>
    <div class="ask-thread" id="askThread" hidden></div>
    <form class="ask-form" id="askForm">
      <textarea id="askInput" rows="2" placeholder="예: Could we sit together? 에서 could를 쓰면 can보다 얼마나 공손해져요?"></textarea>
      <button type="submit" class="btn primary" id="askSend">질문</button>
    </form>
  </section>
  <nav class="sets" id="sets" aria-label="저장된 세트"></nav>
  <div id="main"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="pop" id="pop" role="dialog" aria-label="단어 설명" hidden></div>

<script>

const HANGUL = /[가-힣]/;
function parse(raw) {
  const sections = [];
  let cur = null;
  for (const lineRaw of String(raw).split(/\r?\n/)) {
    const line = lineRaw.trim();
    if (!line) continue;
    let parts = null;
    if (lineRaw.includes("\t")) parts = lineRaw.split("\t");
    else if (line.includes(" | ")) parts = line.split(" | ");
    else if (/\S\s{2,}\S/.test(line)) parts = line.split(/\s{2,}/);
    if (parts) parts = parts.map(s => s.trim()).filter(Boolean);
    if (parts && parts.length >= 2) {
      let a = parts[0], b = parts.slice(1).join(" ");
      if (/원문|^english$/i.test(a) && /해석|한국어|^korean$/i.test(b)) continue;
      if (HANGUL.test(a) && !HANGUL.test(b)) [a, b] = [b, a];
      if (!cur) { cur = { name: "", items: [] }; sections.push(cur); }
      cur.items.push([a, b]);
    } else {
      cur = { name: line.replace(/^\d+\s*[.)]\s*/, ""), items: [] };
      sections.push(cur);
    }
  }
  return sections.filter(s => s.items.length);
}
const countItems = secs => secs.reduce((n, s) => n + s.items.length, 0);

/* ---------- storage: private per-person db, with browser fallback ---------- */
const LS_KEY = "mungjang.sets.v1";
const store = {
  kind: "local", col: null, listeners: [],
  async init(onChange) {
    this.onChange = onChange;
    this.readLocal();
    onChange();

  },
  sets: [], ready: false, chains: {},
  readLocal() {
    try { this.sets = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { this.sets = []; }
    this.ready = true;
  },
  writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.sets)); } catch (e) {} },
  save(set) {
    const body = { title: set.title, raw: set.raw, sections: set.sections, known: set.known || [], createdAt: set.createdAt, updatedAt: Date.now() };
    const i = this.sets.findIndex(s => s.id === set.id);
    const full = { id: set.id, ...body };
    if (i >= 0) this.sets[i] = full; else this.sets.push(full);
    if (this.kind !== "db") { this.writeLocal(); this.onChange(); return Promise.resolve(); }
    this.onChange();
    const prev = this.chains[set.id] || Promise.resolve();
    const next = prev.catch(() => {}).then(() => this.col.doc(set.id).set(body));
    this.chains[set.id] = next;
    return next.catch(e => { toast(e && e.code === "quota_exceeded" ? "저장 공간이 가득 찼어요. 안 쓰는 세트를 지워주세요." : "저장하지 못했어요. 잠시 후 다시 시도해 주세요."); throw e; });
  },
  remove(id) {
    this.sets = this.sets.filter(s => s.id !== id);
    if (this.kind !== "db") { this.writeLocal(); this.onChange(); return Promise.resolve(); }
    this.onChange();
    return this.col.doc(id).delete().catch(() => toast("삭제하지 못했어요. 다시 시도해 주세요."));
  }
};

/* ---------- state ---------- */
let currentId = null;      // id of a saved set, or "sample"
let view = "study";        // study | new | edit
let mode = "hideEn";       // all | hideEn | hideKo — every visit starts with English covered
let hideKnown = false;
let shuffle = false;
let order = null;
let revealed = new Set();
let confirmDelete = false;
let askCtx = null, askCtxKo = "";
let askMsgs = [];
let askBusy = false, askAbort = null;
try { const p = JSON.parse(localStorage.getItem("mungjang.prefs") || "{}"); hideKnown = !!p.hideKnown; } catch (e) {}
function savePrefs() { try { localStorage.setItem("mungjang.prefs", JSON.stringify({ mode, hideKnown, last: currentId })); } catch (e) {} }

const sample = { id: "sample", title: SAMPLE_TITLE, raw: SAMPLE_TEXT, sections: parse(SAMPLE_TEXT), known: [], unsaved: true };
function currentSet() {
  if (currentId === "sample") return sample;
  return store.sets.find(s => s.id === currentId) || null;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }

function pickCurrent() {
  const sets = sortedSets();
  if (currentId === "sample" && sets.length === 0) return;
  if (currentId && sets.some(s => s.id === currentId)) return;
  let last = null; try { last = JSON.parse(localStorage.getItem("mungjang.prefs") || "{}").last; } catch (e) {}
  currentId = (last && sets.some(s => s.id === last)) ? last : (sets[0] ? sets[0].id : "sample");
}
function fmtDate(ms) {
  if (!ms) return "";
  const d = new Date(ms), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
}
const sortedSets = () => store.sets.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

/* ---------- render ---------- */
function render() {
  pickCurrent();
  $("savedState").textContent = "이 기기에 저장됨";
  const sets = sortedSets();
  let chips = sets.map(s => `<button class="chip" data-act="pick" data-id="${esc(s.id)}" aria-pressed="${view === "study" && s.id === currentId}"><span>${esc(s.title)}</span><small>${fmtDate(s.createdAt)}</small></button>`).join("");
  if (!sets.length) chips += `<button class="chip" data-act="pick" data-id="sample" aria-pressed="${view === "study" && currentId === "sample"}"><span>${esc(SAMPLE_TITLE)} (예시)</span><small>저장 안 됨</small></button>`;
  chips += `<button class="chip add" data-act="new" aria-pressed="${view === "new"}">+ 새 세트 붙여넣기</button>`;
  $("sets").innerHTML = chips;

  if (view === "new" || view === "edit") { renderEditor(); return; }
  const set = currentSet();
  if (!set) { $("main").innerHTML = `<p class="empty">저장된 세트가 없어요. ‘새 세트 붙여넣기’로 문장을 추가하세요.</p>`; return; }
  renderStudy(set);
}

function renderEditor() {
  const editing = view === "edit" ? currentSet() : null;
  const title = editing ? editing.title : "";
  const raw = editing ? editing.raw : "";
  $("main").innerHTML = `
  <form class="editor" id="editorForm">
    <h2>${editing ? "세트 수정" : "새 세트"}</h2>
    <label for="fTitle">세트 이름
      <input type="text" id="fTitle" value="${esc(title)}" placeholder="예: 여행 영어, 비즈니스 이메일" maxlength="40">
    </label>
    <label for="fRaw">문장 붙여넣기
      <textarea id="fRaw" placeholder="1. 공항 체크인&#10;I'd like to check in.&#9;체크인하고 싶습니다.&#10;Here is my passport.&#9;여기 제 여권입니다.">${esc(raw)}</textarea>
    </label>
    <p class="hint">한 줄에 한 문장. 영어와 한글 사이는 탭(표·엑셀에서 복사하면 자동) 또는 <code> | </code>로 구분해요. 구분자가 없는 줄은 소제목이 됩니다.</p>
    <p class="hint" id="parseInfo"></p>
    <div class="actions">
      <button type="submit" class="btn primary" id="fSave">저장</button>
      <button type="button" class="btn" data-act="cancel">취소</button>
    </div>
  </form>`;
  const upd = () => {
    const secs = parse($("fRaw").value);
    const n = countItems(secs);
    $("parseInfo").textContent = n ? `인식된 문장 ${n}개 · 소제목 ${secs.filter(s => s.name).length}개` : "아직 인식된 문장이 없어요.";
    $("fSave").disabled = n === 0;
  };
  $("fRaw").addEventListener("input", upd);
  upd();
  $("editorForm").addEventListener("submit", e => {
    e.preventDefault();
    const rawV = $("fRaw").value;
    const secs = parse(rawV);
    if (!countItems(secs)) return;
    const titleV = $("fTitle").value.trim() || ("세트 " + (store.sets.length + 1));
    if (editing && editing.id !== "sample") {
      const keepKnown = (editing.known || []).filter(k => { const [en] = k.split("\u0001"); return secs.some(s => s.items.some(it => it[0] === en)); });
      store.save({ ...editing, title: titleV, raw: rawV, sections: secs, known: keepKnown });
      toast("수정했어요");
    } else {
      const id = "set-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      store.save({ id, title: titleV, raw: rawV, sections: secs, known: [], createdAt: Date.now() });
      currentId = id;
      toast("저장했어요");
    }
    view = "study"; resetSession(); savePrefs(); render();
  });
  if (!editing) $("fTitle").focus();
}

const keyOf = it => it[0] + "\u0001" + it[1];
function resetSession() { revealed = new Set(); order = null; confirmDelete = false; }

function renderStudy(set) {
  const known = new Set(set.known || []);
  const total = countItems(set.sections);
  const knownN = set.sections.reduce((n, s) => n + s.items.filter(it => known.has(keyOf(it))).length, 0);
  const pct = total ? Math.round(knownN / total * 100) : 0;

  let body = "";
  let groups = set.sections.map((s, si) => ({ name: s.name, items: s.items.map((it, ii) => ({ it, n: ii + 1, key: keyOf(it) })) }));
  if (shuffle) {
    if (!order) { order = groups.flatMap(g => g.items.map(x => x.key)); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } }
    const all = new Map(groups.flatMap(g => g.items).map(x => [x.key, x]));
    groups = [{ name: "섞어서 보기", items: order.map((k, i) => all.get(k) && { ...all.get(k), n: i + 1 }).filter(Boolean) }];
  }
  let shown = 0;
  for (const g of groups) {
    const items = hideKnown ? g.items.filter(x => !known.has(x.key)) : g.items;
    if (!items.length) continue;
    const gk = g.items.filter(x => known.has(x.key)).length;
    if (g.name) body += `<div class="section-name">${esc(g.name)} <span>${gk}/${g.items.length}</span></div>`;
    for (const x of items) {
      shown++;
      const isKnown = known.has(x.key);
      const isRev = revealed.has(x.key);
      const wasHidden = side => (side === "en" && mode === "hideEn") || (side === "ko" && mode === "hideKo");
      const cell = (text, side, cls) => {
        const covered = !isRev && ((side === "en" && mode === "hideEn") || (side === "ko" && mode === "hideKo"));
        return covered
          ? `<div class="cell ${cls}"><button class="cover" data-act="reveal" data-key="${esc(x.key)}">탭해서 ${side === "en" ? "영어" : "한글"} 보기</button></div>`
          : (isRev && wasHidden(side))
            ? `<div class="cell ${cls} peek" data-act="rehide" data-key="${esc(x.key)}" title="다시 탭하면 가려져요"><span>${side === "en" ? wordify(text) : esc(text)}</span><button class="rehide" data-act="rehide" data-key="${esc(x.key)}">가리기</button></div>`
            : `<div class="cell ${cls}"><span>${side === "en" ? wordify(text) : esc(text)}</span></div>`;
      };
      body += `<div class="row${isKnown ? " known" : ""}${askCtx === x.it[0] ? " asking" : ""}" data-en="${esc(x.it[0])}" data-ko="${esc(x.it[1])}">

    if (m.role === "user") {
      let c = (m.ctx ? `[질문 대상 문장] ${m.ctx}${m.ctxKo ? `\n[한국어 해석] ${m.ctxKo}` : ""}\n\n` : "") + `[질문] ${m.q}`;
      if (msgs.length === 0) c = sys + "\n\n" + c;
      msgs.push({ role: "user", content: c });
    } else if (m.content && !m.error) msgs.push({ role: "assistant", content: m.content });
    else if (msgs.length && msgs[msgs.length - 1].role === "user" && i < askMsgs.length - 1) msgs.pop();
  });
  return msgs;
}
async function sendAsk(q) {
  q = (q || "").trim();
  if (!q || askBusy) return;
  askMsgs.push({ role: "user", q, ctx: askCtx, ctxKo: askCtxKo });
  const input = buildInput();
  const ans = { role: "assistant", content: "" };
  askMsgs.push(ans);
  askBusy = true; $("askInput").value = ""; renderAsk();
  const sampler = await getSampler();
  if (!sampler) { ans.error = "AI에게 질문하려면 맨 위 ‘AI 설정’에서 API 키를 넣어 주세요."; askBusy = false; renderAsk(); return; }
  const ctrl = new AbortController(); askAbort = ctrl;
  let raf = 0;
  try {
    const r = await sampler(input, { cache: false, signal: ctrl.signal, onText: ({ text }) => { ans.content = text; if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (askMsgs.includes(ans)) renderAsk(); }); } });
    ans.content = r.text;
  } catch (e) {
    if (e && e.code === "aborted") return;
    ans.error = ans.content ? null : aiErrMsg(e, "답");
    if (!ans.error) delete ans.error;
  } finally {
    if (askAbort === ctrl) { askAbort = null; askBusy = false; }
    if (askMsgs.includes(ans)) renderAsk();
  }
}
let askFolded = false;
try { askFolded = localStorage.getItem("mungjang.askFolded") === "1"; } catch (e) {}
function toggleFold(v) {
  askFolded = v;
  $("ask").classList.toggle("collapsed", v);
  $("askFold").textContent = v ? "펼치기" : "접기";
  $("askFold").setAttribute("aria-expanded", String(!v));
  try { localStorage.setItem("mungjang.askFolded", v ? "1" : "0"); } catch (e) {}
}
toggleFold(askFolded);
function syncAskH() { document.documentElement.style.setProperty("--ask-h", $("ask").offsetHeight + "px"); }
try { new ResizeObserver(syncAskH).observe($("ask")); } catch (e) { addEventListener("resize", syncAskH); }
syncAskH();
$("askForm").addEventListener("submit", e => { e.preventDefault(); sendAsk($("askInput").value); });
$("askInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendAsk($("askInput").value); } });
renderAsk();

/* ---------- AI key settings ---------- */
function renderAiState() {
  const k = getKey();
  $("aiState").textContent = k ? `키가 저장돼 있어요 (…${k.slice(-4)}). 단어 뜻과 질문 기능을 쓸 수 있어요.` : "아직 키가 없어요. 키 없이도 가림판은 그대로 쓸 수 있어요.";
  $("aiBtn").textContent = k ? "AI 설정 ✓" : "AI 설정";
}
$("aiBtn").onclick = () => { $("aiPanel").hidden = !$("aiPanel").hidden; if (!$("aiPanel").hidden) $("aiKey").focus(); };
$("aiPanel").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("aiKey").value.trim();
  if (!/^sk-ant-/.test(v)) { toast("sk-ant- 로 시작하는 API 키를 넣어 주세요"); return; }
  try { localStorage.setItem(KEY_LS, v); } catch (err) { toast("이 브라우저에 저장할 수 없어요"); return; }
  $("aiKey").value = ""; renderAiState(); toast("API 키를 저장했어요"); $("aiPanel").hidden = true;
});
$("aiDel").onclick = () => { try { localStorage.removeItem(KEY_LS); } catch (e) {} renderAiState(); toast("API 키를 지웠어요"); };
renderAiState();

render();
store.init(render);
</script>
